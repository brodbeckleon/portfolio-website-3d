<!doctype html>
<html lang="%paraglide.lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e0d5c8" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2a1e15" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="google-site-verification" content="xee6o_1elBHpFB2ecRxF0jNW3Apri5ILPRugI8gkUq8" />
		<!-- The .ico names its sizes so that browsers which read SVG prefer the
		     SVG; Google and older browsers take the .ico. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<style>
			html {
				min-height: 100%;
				width: 100%;
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				overflow-x: hidden;
			}

			@media (prefers-color-scheme: light) {
				html,
				body {
					background-color: #e0d5c8;
				}
			}

			@media (prefers-color-scheme: dark) {
				html,
				body {
					background-color: #2a1e15;
				}
			}
		</style>
		<script>
			// Apply the stored theme before first paint so there is no flash of
			// the wrong colour scheme. "system" simply leaves data-theme unset.
			try {
				const stored = localStorage.getItem('theme');
				if (stored === 'light' || stored === 'dark') {
					document.documentElement.dataset.theme = stored;
				}
			} catch {
				/* storage unavailable (private mode) — fall back to system */
			}
			// Arms the ink reveal on the photography side before first paint;
			// with reduced motion the text simply stays as it is.
			if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
				document.documentElement.classList.add('ink-ready');
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
